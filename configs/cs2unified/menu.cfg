"CS2UnifiedMenu"
{
	"schema"		"1"

	"menu"
	{
		"advanced_default"		"0"
		"confirm_destructive"		"0"
		"telemetry"		"1"

		"perm.config"		"root"
		"perm.diy"		"root"
		"perm.diag"		"root"

		"visible.basic"		"presets,feel,move,visual,status"

		// 2026-10/11 ACTION-log ranking: cs2_full first, vanilla last.
		"order.presets"		"preset:cs2_full,preset:cs2_tracer,preset:cs2_matched,preset:cs2_competitive,preset:movement_only,preset:cs2_split,preset:vanilla"

		// structure decisions first, then the raw feel parameters.
		"order.feel"		"act:recoil,act:bmode,act:clientinfo,act:facts,cvar:cs2feel_enable,cvar:cs2feel_recoil_mode,cvar:cs2feel_recoil_scale,cvar:cs2feel_recoil_view_scale,cvar:cs2feel_ballistics_mode,cvar:cs2feel_ballistics_scale,cvar:cs2feel_ballistics_yaw,cvar:cs2feel_spread_mode,cvar:cs2feel_spread_scale,cvar:cs2feel_spread_move,cvar:cs2feel_spread_posture"

		// slide first (most-touched parameter domain), then injury, then water
		// depth, then the raw speed/model parameters.  A key that is missing
		// here is appended automatically at load time (CS2U_OrderAppendMissing),
		// so an older copy of this file cannot hide a newer parameter.
		"order.move"		"act:slide_tier,cvar:cs2movement_crouch_slide,cvar:cs2movement_crouch_slide_client,cvar:cs2movement_crouch_slide_min_speed,cvar:cs2movement_injury_enable,cvar:cs2movement_injury_mode,cvar:cs2movement_injury_health,cvar:cs2movement_injury_speed,cvar:cs2movement_injury_base,cvar:cs2movement_injury_temp_health,cvar:cs2movement_injury_adrenaline,cvar:cs2movement_water_enable,cvar:cs2movement_water_slowdown,cvar:cs2movement_enable,cvar:cs2movement_apply_global,cvar:cs2movement_engine_speed,cvar:cs2movement_duck_speed,cvar:cs2movement_air_jump_speed,cvar:cs2movement_lowspeed_sustain,cvar:cs2movement_crouch_enable,cvar:cs2movement_maxspeed,cvar:cs2movement_weapon_speed_mode,cvar:cs2movement_duck_speed_min,cvar:cs2movement_base_speed,act:weapon_speeds,act:env_adapt"

		"order.visual"		"cvar:cs2u_tracer_enable,cvar:cs2u_tracer_width,cvar:cs2u_tracer_life,act:camera_detect,act:camera_zero,act:camera_off,act:camera_note"

		"order.status"		"act:status_full,act:status_plain,act:auth_log,act:diag_verify,act:diag_move,act:diag_gamedata,act:diag_l4n"

		"order.config"		"act:save,act:save_custom,act:reload,act:rollback,act:path,act:menu_reset"
	}

	// Identity source. Omit this whole section to keep the historic SourceMod
	// flag path (AUTH-OK source=flag). When one valid entry exists the lists
	// become authoritative: SteamID entry > admin group, conflict -> SteamID.
