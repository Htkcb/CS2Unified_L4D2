// ===========================================================================
// CS2Feel_L4D2 - recommended CS2 profile (pure ASCII, pitfall L1)
// ---------------------------------------------------------------------------
// Plugin: 0.5.6-m8.  Six mapped weapons (TR-48): AK-47, MAC-10, M4A1, MP5-SD,
// SG556, Uzi slot (MP9).  Unmapped weapons keep the native L4D2 values.
//
// The compiled defaults already carry every value below, so exec'ing this file
// is only needed to pin them explicitly (or to restore after an experiment).
// SourceMod does NOT auto-exec plugin cvars (M31: AutoExecConfig was removed on
// purpose).  Copy to cfg/sourcemod/ and add to server.cfg:
//   exec sourcemod/cs2feel_recommended.cfg
//
// BOUNDARY: spread stays native (cs2feel_spread_mode 0).  MOD-2 mode 1 is not a
// published feature: the Uzi increment / A(dt) are still uncalibrated (TV-99),
// and the impact-level calibration exists for the other mapped weapons only.
//
// TICKRATE: the 64 Hz spread profile exists since 0.5.3-m8 (TV-92) but was
// calibrated in the 64 Hz + L7 weapon-script environment (AK 6 tick/shot).  With
// no L7 addon the native cadence is 8 tick/shot and the constants do not apply,
// so leave cs2feel_spread_tick_profile 0 unless you run that environment.
//
// INFINITE AMMO: since 0.5.6-m8 the per-shot source switches from the clip
// decrease to the weapon_fire event when sv_infinite_ammo != 0 (TR-53 / TV-98).
// cs2feel_recoil_wrap defaults to 1 since 0.5.7-m8 (MT-14 / TV-100): >64 consecutive
// shots replay the measured 64-shot steady cycle; a 30-round magazine never reaches
// row 64, so the normal path is unchanged.
// ---------------------------------------------------------------------------
cs2feel_recoil_mode 1
cs2feel_recoil_scale 1.0
cs2feel_recoil_curve 1
cs2feel_recoil_wrap 1
cs2feel_ballistics_mode 1
cs2feel_ballistics_scale 1.0
cs2feel_ballistics_curve 1
cs2feel_ballistics_yaw 1
cs2feel_spread_mode 0
cs2feel_spread_posture 0
cs2feel_spread_move 0
cs2feel_spread_tick_profile 0
