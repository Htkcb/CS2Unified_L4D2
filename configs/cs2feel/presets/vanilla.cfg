// ===========================================================================
// CS2Feel_L4D2 - vanilla rollback preset (pure ASCII, pitfall L1)
// ---------------------------------------------------------------------------
// Restores the pre-M8 pass-through behaviour (native recoil / native aim).
// Spread is native in both profiles; the explicit zeroes below just make the
// state unambiguous after an experiment.
//
// Both modes off means the plugin writes nothing: the native kick is left alone.
// cs2feel_ballistics_yaw and cs2feel_recoil_wrap are pinned as well so that a
// previous experiment cannot leak a non-vanilla value into this profile.
//
// SourceMod does NOT auto-exec plugin cvars (M31: AutoExecConfig was removed
// on purpose).  Copy this file to cfg/sourcemod/ and add to server.cfg:
//   exec sourcemod/cs2feel_vanilla.cfg
// ---------------------------------------------------------------------------
cs2feel_recoil_mode 0
cs2feel_recoil_scale 1.0
cs2feel_recoil_curve 0
cs2feel_recoil_wrap 0
cs2feel_ballistics_mode 0
cs2feel_ballistics_scale 1.0
cs2feel_ballistics_curve 0
cs2feel_ballistics_yaw 0
cs2feel_spread_mode 0
cs2feel_spread_posture 0
cs2feel_spread_move 0
cs2feel_spread_tick_profile 0
