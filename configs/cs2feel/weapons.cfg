// ===========================================================================
// CS2Feel_L4D2 - CS2 per-weapon parameter table (MOD-1 config)
// ---------------------------------------------------------------------------
// SCHEMA      : cs2feel.weapons.v1  (loaded by scripting/cs2feel_config.sp)
// CS2 BUILD   : 1.41.9.2 / ServerVersion 2000935 / SourceRevision 11162119
// SOURCE      : tests/baseline/cs2_recoil_table.json (v3, 13 weapons)
//               measured by tools/m1a_probe v0.7.0 (read-only VData reads) plus,
//               for weapon_mp5sd, the shipped VData (KV3 v5 parse, TV-84)
// PROVENANCE  : every number below is measured; nothing is an estimate.
// MODES       : mode0 = primary fire.  An optional *_alt key carries mode1
//               (secondary fire); when absent it defaults to the mode0 value.
// MAPPING     : l4d2_class is the L4D2 weapon script this CS2 weapon is used
//               for.  Only identical-identity mappings are filled in at M3;
//               an empty l4d2_class means 'not mapped yet (L7)' and the plugin
//               falls back to the native L4D2 values in native_baseline.cfg.
//               Do NOT guess a mapping here.
// UNITS       : inaccuracy_stand / inaccuracy_fire are consumed by MOD-2 as
//               L4D2 **field units** (the native scale of [weapon+0x17EC]).
//               CS2's own VData numbers are in CS2 penalty units; the measured
//               conversion is k = 45.5 field units per penalty unit (TV-41,
//               band 39.2..58.3).  A mapped weapon MUST carry field units:
//               pasting CS2 units straight in was the 45.5x mode-1 defect
//               registered as TR-27.  weapon_ak47, weapon_mac10, weapon_m4a1,
//               weapon_mp5sd, weapon_sg556 and weapon_mp9 are mapped (L7: AK-47 ->
//               weapon_rifle_ak47, MAC-10 -> weapon_smg_silenced, M4A1 -> weapon_rifle,
//               MP5-SD -> weapon_smg_mp5, SG556 -> weapon_rifle_sg552, Uzi slot:
//               MP9 -> weapon_smg, TR-48); the other 7 weapons still carry CS2 units
//               and must be converted (x k, then fit the increment) when their L7
//               mapping is filled in.
//               MAC-10 floor/move below are x45.5 converted.  Its increment IS
//               impact-calibrated (TV-80: 0.0473 field units; three rounds land
//               within +1.3% of the CS2 30-shot saturation, because its cadence is
//               1.86 tick/shot, not AK's 3 -- see TR-39 for the low-field caveat).
//               inaccuracy_move is still the raw conversion.
//               Uzi slot (weapon_mp9 -> weapon_smg): floor 0.4095 = 0.009 x 45.5.
//               Its increment IS impact-calibrated too (TV-101: 0.1684 -> 0.0415
//               field units).  The x45.5 translation overshoots 4.06x because the
//               Uzi fires every 2.10 tick (0.0701 s = the L7 addon's 0.07 s
//               CycleTime) so A = 0.84 vs AK's 0.78.  Three rounds n=90 land at
//               s = 0.6207 against the CS2 30-shot target 0.6213 (-0.1%).
//               inaccuracy_move is STILL the raw conversion (CS2 has no MP9
//               speed ladder, TR-43) and spread_move stays 0.
// CALIBRATION : weapon_ak47 floor 0.2917 = TV-41 (k x 0.00641).  increment is
//               TV-41's 0.1744 scaled by the measured steady state: TV-43 saw
//               impact RMS 0.556 deg at 0.1744, which inverts (TV-41 transfer)
//               to s_inf = 1.0808, i.e. (1-r) = 0.2210; hitting TV-41's 30-shot
//               saturation 0.9285 needs (0.9285-0.2917)*(1-r) = 0.1407.
//               Since s_inf is linear in the increment, 0.141 is the value to
//               verify at the impact level (TV-45).  Do not "improve" it by
//               theory: the per-shot decay is set by the command stream, not by
//               the nominal 3-tick cadence (see TV-43 / M37).
// v4 doc      : docs technical plan v4, section 3.1
// ===========================================================================
