// ===========================================================================
// CS2Movement_L4D2 -- cs2movement.cfg
// ---------------------------------------------------------------------------
// DEFAULT ENABLED (2026-10-27): cs2movement_enable 1 + engine per-player speed.
//
// Deploy path : left4dead2/cfg/sourcemod/cs2movement.cfg
// Reload      : sm_cs2movement_reload
//
// Values are CS2 1.41.9.1 references unless marked otherwise.  Items marked
// "uncertain" are configurable on purpose; see docs/02 (parameters and acceptance).
//
// This file is intentionally ASCII-only: L4D2's cfg parser has known problems
// with non-ASCII text and braces (see CS2Feel_L4D2 pitfalls M20/M31).
// ===========================================================================

// --- core ---------------------------------------------------------------
cs2movement_enable 1
cs2movement_debug 0
cs2movement_mode 1
cs2movement_apply_global 1

// --- ground / air / gravity (L4D2 has these engine cvars) ----------------
cs2movement_accelerate 5.5
cs2movement_friction 5.2
cs2movement_stopspeed 80.0
cs2movement_airaccelerate 12.0
cs2movement_air_max_wishspeed 30.0
cs2movement_gravity 800.0
// L4D2 ships sv_maxspeed 1000. Lowering it also caps special-infected abilities
// (Charger charge = z_charge_max_speed 500); the survivor cap is per-player
// (m_flMaxspeed), not by this global cvar.
cs2movement_maxspeed 1000.0
cs2movement_maxvelocity 3500.0

// --- jump / speed model --------------------------------------------------
cs2movement_jump_impulse 301.993
cs2movement_jump_height 57.0
cs2movement_base_speed 250.0
cs2movement_weapon_speed_mode 1
cs2movement_walk_multiplier 0.52
cs2movement_duck_multiplier 0.34

// --- bhop / landing (Stage 3; registered now) ----------------------------
cs2movement_bhop_enable 0
cs2movement_autobhop 0
cs2movement_bhop_speed_cap 286.0
cs2movement_bhop_window 0.0078125
cs2movement_jump_spam_penalty 0.015625
cs2movement_landing_penalty 1
cs2movement_landing_speed_factor 0.75
cs2movement_landing_next_factor 0.88
cs2movement_landing_enforce 0
cs2movement_jump_enforce 0

// --- crouch (Stage 1: press limit only; Stage 2: duck state) -------------
cs2movement_crouch_enable 1
cs2movement_duck_rate 6.4
cs2movement_time_between_ducks 0.4
cs2movement_stand_eye 64.0
cs2movement_duck_eye 46.0
cs2movement_stand_hull 72.0
cs2movement_duck_hull 54.0
cs2movement_air_crouch_shift 9.0
cs2movement_crouch_jump 1
cs2movement_crouch_view 0

// --- client sync / per-player speed --------------------------------------
cs2movement_client_sync 0
cs2movement_write_props 1
cs2movement_speed_enforce 1
// Engine-layer per-player speed (SetupMove hook). Requires write_props +
// speed_enforce, plus DHooks and gamedata/cs2movement.txt; fail-closed.
cs2movement_engine_speed 1
// Engine-layer crouch speed (0.4.2): rescale the engine's duck move factor so
// the per-player crouch speed becomes CS2 weapon speed x duck_multiplier.
// Same fail-closed dependency as engine_speed.
cs2movement_duck_speed 1
// Ground friction cannot sustain a wishspeed below
// sv_stopspeed*sv_friction/sv_accelerate = 80*5.2/5.5 = 75.64 u/s
// (measured: 73 -> 27, 75 -> 63, 78 -> 78.0). CS2 crouch targets below that
// are floored to keep crouch-walking stable; 0 disables the floor.
cs2movement_duck_speed_min 76.0
// Per-player friction compensation (0.4.3, opt-in, default 0). CGameMovement::
// Friction removes max(|v|,sv_stopspeed)*surfaceFriction*sv_friction*dt per tick
// while Accelerate can only add sv_accelerate*dt*wishspeed*surfaceFriction. Any
// wishspeed below stopspeed*friction/accelerate = 75.64 therefore collapses.
// With this on, the cap is applied to the friction drop so that Accelerate can
// still land exactly on the wishspeed: sub-threshold duck speeds (AK 73.1,
// AWP 68) become sustainable and low caps stop crawling.  Keep 0 unless you
// want that; requires write_props + speed_enforce and the CS2M_Friction
// gamedata signature.  Opt-in because it is a per-player server-side
// correction that the client's own Friction does not predict.
cs2movement_lowspeed_sustain 0
// CS2 air maxspeed (0.4.4, opt-in, default 0). L4D2 tucks the survivor into the
// duck hull automatically for most of every jump (FL_DUCKING / m_bDucked set on
// the jump tick even from a standing start), and the L4D2 AirMove override
// clamps the air wishspeed against mv+0x38 before calling AirAccelerate. Air
// acceleration therefore uses the engine duck maxspeed: at 64 tick
// 12*76/64 = 14.25 u/s per tick instead of the 30 u/s addSpeed cap that CS2
// gets with the weapon speed (215); at 30 tick the two coincide (12*76/30 =
// 30.4). 1 = keep the weapon maxspeed in the air unless the player holds +duck
// (CS2 air behaviour). Server-side only: the client still predicts the engine
// duck speed, so enable it only if you want CS2 air acceleration and accept the
// prediction correction.
cs2movement_air_jump_speed 0
// CS2-style crouch slide (0.4.5, opt-in, default 0). L4D2's WalkMove rescales
// the velocity to mv+0x38 in one tick when the player ducks, so a run at 215
// snaps to ~75 instead of sliding. With this on, a fresh duck press while
// running on the ground keeps the momentum on an exponential curve that reaches
// the crouch target after cs2movement_crouch_slide_time seconds (CS2's own
// friction curve takes about 0.20 s; 0.10 s is the safer short variant).
// Server-side only: client.dll still predicts the vanilla duck clamp, so the
// local player gets a positional correction; measure before enabling.
// Requires write_props + speed_enforce + duck_speed + the CS2M_CheckParams
// signature.
cs2movement_crouch_slide 0
cs2movement_crouch_slide_time 0.10
cs2movement_crouch_slide_min_speed 100.0

// --- low-health limp (0.5.0, retuned in 0.5.1) ---------------------------
// L4D2 slows a survivor once total health drops below survivor_limp_health
// (40): the engine lowers m_flMaxspeed to survivor_limp_walk_speed (85).  The
// per-player speed layer rewrites m_flMaxspeed for every survivor every tick,
// which erases that value, so this layer re-applies the penalty on top of the
// CS2 target.  Measured on a stock 64 tick server (find survivor_limp):
//   survivor_limp_health = 40 / survivor_limp_walk_speed = 85 / survivor_speed = 210
// Trigger is always the vanilla threshold: total health (permanent + temporary)
// below survivor_limp_health, i.e. 39 HP and down on a stock server.
//
// mode 1 = ratio (default): CS2 target * (injury_speed / injury_base).  The
//     shipped 132/220 = 60% is a deliberate step away from vanilla's
//     85/220 = 38.6%, which feels immobile once applied per weapon: AK 215 ->
//     129, M4 225 -> 135, SMG 240 -> 144, AWP 200 -> 120, melee 250 -> 150.
//     Set injury_speed 85 for exact vanilla, or 0 to follow the engine cvar.
//     Cost: the client still predicts 85, so limping players get a small
//     per-tick correction.
// mode 0 = absolute cap: every limping weapon is capped at injury_speed itself
//     (132 by default).  Cheapest to reason about, and exact on the client
//     whenever the client's own number matches.
cs2movement_injury_enable 1
cs2movement_injury_mode 1
// Healthy reference for the ratio denominator.  220 = what the engine actually
// reports; survivor_speed is 210, which would understate the penalty by 5%.
// 0 = follow survivor_speed instead.
cs2movement_injury_base 220.0
// Threshold stays on the engine cvar (40).  The engine one is cheat-protected,
// so on a server with sv_cheats 0 set 40.0 here instead.
cs2movement_injury_health 0.0
// Limp speed (u/s).  132 = 60% of 220 (shipped default); 85 = exact vanilla;
// 0 = follow survivor_limp_walk_speed.  Raise it for a milder penalty.
cs2movement_injury_speed 132.0
// Vanilla counts temporary health (pills / revive buffer) toward the 40 and
// lets adrenaline ignore the limp completely (adrenaline runs at 260 u/s at
// any health; the plugin's weapon cap still applies).
cs2movement_injury_temp_health 1
cs2movement_injury_adrenaline 1

cs2movement_crouch_enforce 0
cs2movement_write_timing 0
