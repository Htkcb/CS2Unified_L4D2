; cs2feel_aimsync.ini -- 客户端一半（Left4Neko 插件 cs2feel_aimsync.dll 的配置）
;
; 放到： <游戏目录>\bin\neko\plugins\cs2feel_aimsync.ini
; 前提： 同一目录下有 cs2feel_aimsync.dll（Left4Neko 会在启动时扫 bin\neko\plugins\）。
;
; 唯一必须与服务器一致的值是 ratio：
;
;     ratio = cs2feel_ballistics_scale / cs2feel_recoil_scale
;
;   * 服务器「匹配」结构（ballistics_mode 0，整合包默认）       -> ratio = 0.0        （逐位惰性，什么都不改）
;   * 服务器「CS2 原生」结构（back 后坐结构页切到 Native split）-> ratio = -0.090909
;     对应 cs2feel_recoil_scale 1.10 / cs2feel_ballistics_mode 1 / cs2feel_ballistics_scale -0.10
;
; 两边不一致的代价：不会影响服务器子弹/命中，只会让客户端可见弹孔偏 0.091 倍 punch
; （AK 满自动约 0.53 度）。服务器切档后，本文件会被 1 秒内热重载，不用重启游戏。
;
; 已知边界（见 CS2FeelVScript_L4D2 的 docs/TR40/README.md）：
;   - 客户端预测吃的是上一条命令的 punch，满自动时可见后坐仍比真实子弹滞后一发份（实测 1.76 度）；
;   - 本文件只在 -insecure / LAN 下使用；不要用于 VAC 服务器。

[aimsync]
enable     = 1
ratio      = 0.0
yaw        = 1
max_deg    = 8.0
log        = 0
log_every  = 1
verbose    = 0
