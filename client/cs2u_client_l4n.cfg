// CS2Unified_L4D2 -- 可选客户端增强：相机 / 准星分离（需要 Left4Neko）
//
// 机制：Left4Neko 的 l4n_view_punch_scale 只缩放「渲染相机」那一次 punch 消费
// （C_TerrorPlayer::CalcView），在 FireBullet 之前就把字段还原；因此服务器
// 子弹、命中、客户端预测弹孔都不受影响，只有你看到的相机会变。
//
// 服务器无法设置这一项（它是客户端 cvar），所以这是玩家自选的：
//
//   用法：1) 把本文件放到  left4dead2\cfg\  下
//         2) 在 autoexec.cfg 里加一行：  exec cs2u_client_l4n
//
//   取值：
//     1.10  CS2 的比例（相机 1.10 / 弹道 1.00）—— 推荐
//     0     相机冻结、弹道整条爬升（最强分离；后坐反馈没了）
//     1.0   关闭（本栈默认，所见即所中）
//
// 注意：不要和服务器预设 cs2_split 叠加（那套是服务器侧分离，弹孔不跟随命中）。
// 当前生效值随时可在游戏内控制台查：l4n_view_punch_scale

l4n_view_punch_scale 1.0
// 2026-11-02: on a server that already runs the CS2-native split (CS2Unified 1.0.4+),
// 0 = frozen crosshair with visibly climbing decals, 1.0 = no camera split. Do NOT use
// 1.10 there: it would stack with the server split (camera 1.10 x server 1.10).

// 2026-11-03 (1.0.7): the cs2_full preset is ??�TR-40, which is calibrated with Left4Neko
// untouched (1.0). A frozen camera (0) would add the whole punch on top of the +1.20
// offset and overshoot the measured 4.98 deg gap.